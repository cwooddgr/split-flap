<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flip Flap Display</title>
    <style>
        html, body {
            background: #000000;
        }
    </style>
    <!-- Icons and manifest -->
    <link rel="icon" href="favicon.ico" sizes="any">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="icon" type="image/png" sizes="96x96" href="favicon-96x96.png">
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
    <link rel="manifest" href="site.webmanifest">
    <meta name="theme-color" content="#000000">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container display-container">
        <div class="display-board" id="displayBoard">
            <!-- Flaps will be dynamically generated here -->
        </div>
    </div>

    <div id="audioPrompt">
        <span>Tap once to enable sound</span>
    </div>

    <div id="smallScreenMessage" class="hidden">
        <span>This page is meant for a big screen.</span>
    </div>

    <div id="qr-container">
        <div id="qrcode"></div>
    </div>

<!-- QR code library (global QRCode constructor) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <!-- Display wiring (Firestore + room + QR) -->
    <script type="module" src="display.js"></script>
</body>
</html>
