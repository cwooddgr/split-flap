name: Deploy web

# Publishes web/ (and nothing else in the repo) to flipflap.dgrlabs.co.
# The custom domain lives in the repo's Pages settings; a CNAME file is
# ignored when Pages deploys from a workflow.
# The tvOS app hardcodes https://flipflap.dgrlabs.co/control.html, so
# web/control.html must keep its name and place.

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish; queue the newest one behind it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v5
