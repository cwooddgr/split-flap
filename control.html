<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flip Flap Remote</title>
    <style>
        html, body {
            background: #000000;
        }
    </style>
    <!-- Icons and manifest -->
    <link rel="icon" href="favicon.ico" sizes="any">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="icon" type="image/png" sizes="96x96" href="favicon-96x96.png">
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
    <link rel="manifest" href="site.webmanifest">
    <meta name="theme-color" content="#000000">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container controller-container">
<p id="roomError" class="room-error" hidden>
            Invalid or missing room. Please rescan the QR code on the display.
        </p>

        <div class="controls">
            <textarea
                id="textInput"
                placeholder="Enter text to display..."
                rows="4"
            ></textarea>
            <button id="displayBtn">Display</button>
            <button id="randomBtn">Random Quote</button>
            <button id="funnyBtn">Funny Quote</button>
            <button id="clearBtn">Clear</button>
        </div>

        <div class="cross-promo">
            <p class="cross-promo-text">Also by DGR Labs for Apple TV:<br><strong>CD Wally</strong> — browse your CDs playlist like a &rsquo;90s CD wallet</p>
            <a href="https://dgrlabs.co/g/cdwtv/ffr" target="_blank" rel="noopener"><img class="cross-promo-icon" src="cdwally-icon.png" alt="CD Wally icon" /></a>
            <a href="https://dgrlabs.co/g/cdwtv/ffr" class="app-store-badge" target="_blank" rel="noopener">
                <img src="https://tools.applemediaservices.com/api/badges/download-on-the-app-store/black/en-us?size=250x83" alt="Download on the App Store" />
            </a>
        </div>
    </div>

    <script type="module" src="control.js"></script>
</body>
</html>
