<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Split-Flap Display</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="display-board" id="displayBoard">
            <!-- Flaps will be dynamically generated here -->
        </div>
        
        <div class="controls">
            <textarea id="textInput" placeholder="Enter text to display..." rows="4"></textarea>
            <button id="displayBtn">Display</button>
            <button id="randomBtn">Random Quote</button>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
