<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Split-Flap Display</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container display-container">
        <div class="display-board" id="displayBoard">
            <!-- Flaps will be dynamically generated here -->
        </div>
    </div>

    <div id="qr-container">
        <div id="qrcode"></div>
    </div>

<!-- QR code library (global QRCode constructor) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <!-- Display wiring (Firestore + room + QR) -->
    <script type="module" src="display.js"></script>
</body>
</html>
